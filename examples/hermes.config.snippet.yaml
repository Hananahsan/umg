# Hermes Agent — umg0 MCP server snippet
# Merge into your Hermes MCP / agent configuration.
#
# Preferred: npx (no absolute paths). After global install, use:
#   command: umg0
#   args: [mcp]
#
# From-source fallback:
#   command: node
#   args: [/absolute/path/to/umg/dist/index.js, mcp]

mcp_servers:
  umg:
    command: npx
    args:
      - -y
      - @umg0/umg0
      - mcp
    env:
      UMG_LOG_LEVEL: info

