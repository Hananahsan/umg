name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run e2e

  inspector-assets:
    # inspector-ui/dist is committed so the published package works without the
    # UI toolchain. Rebuild it and fail if the committed output has drifted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inspector-ui/package-lock.json
      - run: npm --prefix inspector-ui ci
      - run: node scripts/check-inspector-assets.mjs
