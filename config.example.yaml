# Unified Memory Gateway v0.2 — example config
# Copy to ~/.umg/config.yaml or ./umg.config.yaml

db_path: "~/.umg/memory.db"
default_namespace: "global"
log_level: "info" # debug | info | warn | error

retain:
  min_importance:
    working: 0.15
    episodic: 0.35
    semantic: 0.50
    procedural: 0.60
  max_content_chars: 4000
  auto_tier: true

recall:
  default_limit: 8
  max_limit: 25
  min_score: 0.08
  # Weights should sum ≈ 1.0 (warn only if not)
  ranking_weights:
    fts: 0.32
    importance: 0.18
    decay: 0.18
    tier: 0.08
    recency: 0.08
    entity: 0.16

consolidation:
  # Cheap pre-filter: below this similarity a pair is not considered for
  # merging at all. It is NOT the safety mechanism — merge_min_confidence is.
  # Calibrated so unrelated pairs (which top out around 0.47 on the labeled
  # corpus) never reach the confidence gate.
  merge_threshold: 0.55
  # The actual gate. Merging discards a memory, so it requires positive
  # confidence the two state the same fact. Below this, both rows are kept and
  # metadata.merge_deferred records why — the same additive-first treatment
  # ambiguous contradictions get. Measured band on the labeled corpus:
  # duplicates 0.62–0.93, unrelated 0.07–0.28.
  merge_min_confidence: 0.55
  merge_max_passes: 3
  light_prune_every_n_writes: 25
  eviction_floor: 0.12
  archive_retention_days: 90
  grace_period_days: 3
  auto_promote: true
  promote_min_recalls: 3
  promote_min_sessions: 2
  archive_sources_on_promote: true
  promote_min_avg_importance: 0.55
  promote_min_skill_chars: 80
  promote_dry_run_proposed: false
  supersede_min_confidence: 0.75
  evict_procedural: false
  half_lives_days:
    working: 0.5
    episodic: 14
    semantic: 120
    procedural: 730
  caps:
    working: 50
    episodic: 500
    semantic: 1000
    procedural: 200
    global: 2000
  decay:
    alpha: 0.65
    beta: 0.35
    access_saturation: 5
    procedural_access_saturation: 12
    session_boost: 0.15
    session_boost_half_life_hours: 4

sqlite:
  busy_timeout_ms: 5000
  size_warn_bytes: 52428800 # 50 MB soft warn in stats

namespace:
  # When true, recall defaults to default_namespace if omitted (project isolation)
  hard_isolation: false

# Optional hybrid path — OFF by default. FTS remains primary offline path.
embeddings:
  enabled: false
  provider: "openai_compatible"
  model: "text-embedding-3-small"
  api_key_env: "UMG_EMBEDDING_API_KEY"
  base_url: null
  hybrid_fts_weight: 0.55
  hybrid_cosine_weight: 0.25

reflect:
  max_extract: 5
  auto_retain: true
  llm:
    enabled: false
    provider: "openai_compatible"
    model: "gpt-4.1-mini"
    base_url: null
    api_key_env: "UMG_LLM_API_KEY"

observability:
  event_log: true
  max_events: 10000
  metrics_window_days: 7
